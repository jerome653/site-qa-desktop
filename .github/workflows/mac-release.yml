name: Build macOS Release

# Builds the arm64 DMG on a real macOS (Apple Silicon) runner and publishes it
# as a GitHub Release on THIS repo, tagged from the package.json version.
#
# browsers/ (Playwright Chromium ~534MB) and engine/node_modules are gitignored,
# so CI repopulates them before packaging — otherwise the DMG ships broken.
#
# Trigger: push to mac-release. Once proven, add `main` to the branches list
# (or move this file onto main) to release from main instead.

on:
  push:
    branches: [mac-release]
  workflow_dispatch: {}

# Allow the built-in GITHUB_TOKEN to create releases / upload assets.
permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-14+ runners are Apple Silicon (arm64) — matches the --arm64 build.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read app version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install shell deps
        run: npm install

      - name: Install engine deps
        working-directory: engine
        run: npm install

      # Playwright 1.60 pins chromium-1223 + chromium_headless_shell-1223 + ffmpeg-1011.
      - name: Install Playwright browsers
        working-directory: engine
        run: npx playwright install chromium ffmpeg

      # electron-builder bundles ./browsers as extraResources. Copy the Playwright
      # cache (macOS: ~/Library/Caches/ms-playwright) into it so the DMG carries Chromium.
      - name: Populate browsers/ for bundling
        run: |
          set -euo pipefail
          mkdir -p browsers
          cp -R "$HOME/Library/Caches/ms-playwright/." browsers/
          echo "browsers/ contents:"
          ls -1 browsers/

      - name: Smoke test
        run: npm run smoke

      # dist:mac already sets CSC_IDENTITY_AUTO_DISCOVERY=false (unsigned, ad-hoc
      # signed by build/after-pack.js). No signing secrets required.
      - name: Build arm64 DMG
        run: npm run dist:mac

      - name: List build output
        run: ls -la release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="mac-v${VERSION}"
          DMG=$(ls release/*.dmg | head -n1)
          echo "Releasing $DMG under tag $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "SGEN Site QA ${VERSION} (macOS arm64)" \
              --notes "Unsigned arm64 DMG. First run: right-click → Open, or \`xattr -cr \"/Applications/SGEN Site QA.app\"\` to clear quarantine." \
              --target "${{ github.sha }}"
          fi

      # Fallback artifact so the DMG is downloadable even if the release step is skipped.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgen-site-qa-macos-arm64
          path: release/*.dmg
          if-no-files-found: error
